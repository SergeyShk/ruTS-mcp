[project]
name = "ruts-mcp"
version = "0.1.0.dev6"
description = "MCP server for ruTS: statistics of Russian texts as tools for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Sergey Shkarin", email = "kouki.sergey@gmail.com" }]
maintainers = [{ name = "Sergey Shkarin", email = "kouki.sergey@gmail.com" }]
keywords = [
    "MCP",
    "model context protocol",
    "LLM",
    "agents",
    "NLP",
    "text",
    "statistics",
    "readability",
    "russian",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    "Natural Language :: Russian",
]
dependencies = [
    "fastmcp>=4,<5",
    "ruts>=0.15.2,<0.16",
]

[project.scripts]
ruts-mcp = "ruts_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/SergeyShk/ruTS-mcp"
Repository = "https://github.com/SergeyShk/ruTS-mcp"
Documentation = "https://sergeyshk.github.io/ruTS-mcp/"
Issues = "https://github.com/SergeyShk/ruTS-mcp/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruts_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/ruts_mcp", "/README.md", "/README.en.md", "/LICENSE.txt"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
test = ["pytest>=8.3", "pytest-cov>=6.0"]
lint = ["mypy>=1.14", "pre-commit>=4.0", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["ruts_mcp", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["ruts_mcp"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801", "N802"]

[tool.mypy]
python_version = "3.11"
files = ["ruts_mcp"]
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v --strict-markers --strict-config --doctest-modules"
testpaths = ["tests", "ruts_mcp"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["ruts_mcp"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
