name: publish

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Check version matches tag
        run: |
          version="$(uv version --short)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Version in pyproject.toml ($version) does not match the tag ($GITHUB_REF_NAME)"
            exit 1
          fi
      - name: Build distribution
        run: uv build
      - name: Check distribution
        run: |
          uv tool run twine check dist/*
          ls -l dist
      - name: Publish distribution (test)
        if: github.event_name == 'push'
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always
      - name: Publish distribution
        if: github.event_name == 'release'
        run: uv publish --trusted-publishing always
      - name: Wait for PyPI
        if: github.event_name == 'release'
        timeout-minutes: 10
        run: |
          until curl -sfo /dev/null "https://pypi.org/pypi/ruts-mcp/$GITHUB_REF_NAME/json"; do
            sleep 15
          done
      - name: Publish to MCP Registry
        if: github.event_name == 'release'
        env:
          PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz
          PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "$PUBLISHER_URL"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          jq --arg v "$GITHUB_REF_NAME" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  stable:
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Плагин в маркетплейсе раздается из stable: он сдвигается только на релиз
      - name: Move stable to the release
        run: git push origin "HEAD:refs/heads/stable"
