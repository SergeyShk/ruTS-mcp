name: publish

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Check version matches tag
        run: |
          version="$(uv version --short)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Version in pyproject.toml ($version) does not match the tag ($GITHUB_REF_NAME)"
            exit 1
          fi
      - name: Build distribution
        run: uv build
      - name: Check distribution
        run: |
          uv tool run twine check dist/*
          ls -l dist
      - name: Publish distribution (test)
        if: github.event_name == 'push'
        run: uv publish --index testpypi --trusted-publishing always
      - name: Publish distribution
        if: github.event_name == 'release'
        run: uv publish --trusted-publishing always
      - name: Wait for PyPI
        if: github.event_name == 'release'
        timeout-minutes: 10
        run: |
          until curl -sfo /dev/null "https://pypi.org/pypi/ruts-mcp/$GITHUB_REF_NAME/json"; do
            sleep 15
          done
      - name: Publish to MCP Registry
        if: github.event_name == 'release'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          jq --arg v "$GITHUB_REF_NAME" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
