site_name: ruTS-mcp
site_url: https://sergeyshk.github.io/ruTS-mcp/
site_description: "MCP-сервер для ruTS: статистики русского текста как инструменты для LLM-агентов"
repo_url: https://github.com/SergeyShk/ruTS-mcp

nav:
    - Главная:
      - О проекте: index.md
      - Установка: installation.md
      - Авторы: authors.md
    - Инструменты:
      - Общее: tools/index.md
      - Статистики текста: tools/analyze_text.md
      - Конкорданс KWIC: tools/kwic.md
      - Коллокации: tools/collocations.md
      - Дисперсия слов: tools/dispersion.md
      - Ключевые слова: tools/keyness.md
      - Сравнение корпусов: tools/compare_texts.md
    - Ресурсы и промпты: resources.md

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Темная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  font:
    text: Source Sans Pro
    code: Source Code Pro
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

validation:
  anchors: warn

plugins:
  - search:
      lang:
        - ru
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: "MCP server for ruTS: statistics of Russian texts as tools for LLM agents"
          nav_translations:
            Главная: Home
            О проекте: About
            Установка: Installation
            Авторы: Authors
            Инструменты: Tools
            Общее: Overview
            Статистики текста: Text statistics
            Конкорданс KWIC: KWIC concordance
            Коллокации: Collocations
            Дисперсия слов: Word dispersion
            Ключевые слова: Keywords
            Сравнение корпусов: Corpus comparison
            Ресурсы и промпты: Resources and prompts

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SergeyShk
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kouki91/

extra_css:
  - css/extra.css

markdown_extensions:
  - toc:
      permalink: True
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
